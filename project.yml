name: PocketStudio
options:
  bundleIdPrefix: com.godthefather1952
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  StableDiffusion:
    url: https://github.com/apple/ml-stable-diffusion
    exactVersion: 1.1.1
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: 0.9.19

targets:
  PocketStudio:
    type: application
    platform: iOS
    sources:
      - path: PocketStudio
    dependencies:
      - package: StableDiffusion
        product: StableDiffusion
      - package: ZIPFoundation
        product: ZIPFoundation
    info:
      path: PocketStudio/Info.plist
      properties:
        CFBundleDisplayName: Pocket Studio
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSPhotoLibraryAddUsageDescription: Pocket Studio saves the images you generate to your photo library.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.godthefather1952.pocketstudio
        PRODUCT_NAME: PocketStudio
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_BITCODE: NO
    scheme: {}
